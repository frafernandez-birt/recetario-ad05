<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Paso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${paso.id == null ? 'Nuevo Paso' : 'Editar Paso'}">Formulario</h1>
    <hr>

    <form th:action="@{/pasos/guardar}" th:object="${paso}" method="post">
        <input type="hidden" th:field="*{id}" />

        <!-- SELECTOR DINÁMICO DE RECETAS -->
        <div class="mb-3">
            <label for="receta" class="form-label">Receta:</label>
            <select class="form-select" th:field="*{receta}">
                <option value="">-- Selecciona una receta --</option>
                <!-- Bucle que genera las opciones desde la base de datos -->
                <option th:each="r : ${recetas}" 
                        th:value="${r.id}" 
                        th:text="${r.nombre}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="orden" class="form-label">Orden (Número):</label>
            <input type="number" class="form-control" th:field="*{orden}" required />
        </div>

        <div class="mb-3">
            <label for="instruccion" class="form-label">Instrucción:</label>
            <textarea class="form-control" th:field="*{instruccion}" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/pasos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
