<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Pasos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Pasos de las Recetas</h1>
    <hr>

    <!-- Aviso si no hay recetas creadas -->
    <div th:if="${param.error == 'sin_recetas'}" class="alert alert-warning">
        Debes crear al menos una receta antes de añadir pasos. <a th:href="@{/recetas/nueva}">Crear receta aquí</a>.
    </div>

    <a th:href="@{/pasos/nuevo}" class="btn btn-primary mb-3">Nuevo Paso</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Receta</th>
                <th>Orden</th>
                <th>Instrucción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="paso : ${pasos}">
                <td th:text="${paso.id}">1</td>
                <!-- Aquí mostramos el dato descriptivo de la receta -->
                <td th:text="${paso.receta.nombre}">Nombre Receta</td>
                <td th:text="${paso.orden}">1</td>
                <td th:text="${paso.instruccion}">Hacer algo...</td>
                <td>
                    <a th:href="@{/pasos/editar/{id}(id=${paso.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/pasos/borrar/{id}(id=${paso.id})}" class="btn btn-sm btn-danger">Borrar</a>
                    
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
