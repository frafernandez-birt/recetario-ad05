<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Recetas</title>
    <!-- Bootstrap por CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Recetario</h1>
    <hr>
    
    <!-- Botón para ir al formulario de alta -->
    <a th:href="@{/recetas/nueva}" class="btn btn-primary mb-3">Nueva Receta</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Bucle para recorrer la lista de recetas que envía el controlador -->
            <tr th:each="receta : ${recetas}">
                <td th:text="${receta.id}">1</td>
                <td th:text="${receta.nombre}">Nombre de ejemplo</td>
                <td th:text="${receta.descripcion}">Descripción de ejemplo</td>
                <td>
                    <!-- Botón de editar -->
                    <a th:href="@{/recetas/editar/{id}(id=${receta.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/recetas/borrar/{id}(id=${receta.id})}" class="btn btn-sm btn-danger">Borrar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
