<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Borrado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="text-danger">Confirmar Borrado de Paso</h1>
    <hr>

    <div class="alert alert-warning">
        ¿Estás seguro de que quieres eliminar el paso número <strong th:text="${paso.orden}"></strong> 
        de la receta <strong th:text="${paso.receta.nombre}"></strong>?
        <br>
        <em>La receta principal no se borrará.</em>
    </div>

    <form th:action="@{/pasos/borrar/{id}(id=${paso.id})}" method="post">
        <button type="submit" class="btn btn-danger">Sí, eliminar paso</button>
        <a th:href="@{/pasos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
